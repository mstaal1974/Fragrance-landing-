<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · Maison Obsidian</title>
<style>
  :root { --bg:#0b0b0d; --panel:#101015; --line:#1f1f27; --gold:#c9a961; --cream:#f3ecdc; --mono:'Space Mono',monospace; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--cream); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:40px 24px 80px; }
  h1 { font-weight:400; font-size:26px; margin:0 0 4px; }
  .sub { font-family:var(--mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); }
  .tabs { display:flex; gap:8px; margin:22px 0 0; }
  .tab { background:none; border:1px solid var(--line); color:rgba(243,236,220,0.6); padding:9px 20px; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; }
  .tab.active { border-color:var(--gold); color:var(--gold); }
  .bar { display:flex; gap:10px; align-items:center; margin:18px 0; flex-wrap:wrap; }
  input[type=password]{ background:var(--panel); border:1px solid var(--line); color:var(--cream); padding:10px 14px; font-size:14px; min-width:280px; outline:none; }
  input:focus { border-color:rgba(201,169,97,0.5); }
  button.go { background:var(--gold); color:var(--bg); border:0; padding:10px 20px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; font-size:12px; cursor:pointer; }
  button.ghost { background:none; color:rgba(243,236,220,0.6); border:1px solid var(--line); padding:10px 16px; text-transform:uppercase; font-size:12px; letter-spacing:0.08em; cursor:pointer; }
  .msg { font-size:13px; color:rgba(243,236,220,0.6); margin:8px 0; }
  .msg.err { color:#c9887a; }
  .count { font-family:var(--mono); font-size:11px; color:rgba(243,236,220,0.5); margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-family:var(--mono); font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); position:sticky; top:0; background:var(--bg); }
  tr:hover td { background:rgba(255,255,255,0.02); }
  .strong { color:var(--cream); }
  .brand { font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(243,236,220,0.5); }
  .amount { font-family:var(--mono); color:var(--gold); white-space:nowrap; }
  .muted { color:rgba(243,236,220,0.5); }
  .ref { font-family:var(--mono); font-size:10px; color:rgba(243,236,220,0.4); }
  a { color:var(--gold); }
  .scroll { overflow-x:auto; border:1px solid var(--line); }
  /* Items — our name + the fragrance it's inspired by */
  .item-line { margin:0 0 7px; }
  .item-line:last-child { margin-bottom:0; }
  .item-scent { padding-left:10px; margin-top:2px; }
  .insp { font-family:var(--mono); font-size:10px; letter-spacing:0.06em; color:rgba(201,169,97,0.85); }
  /* Shipping details */
  .ship-name { color:var(--cream); }
  /* Packed checkbox + fulfilled rows */
  td.pack { text-align:center; white-space:nowrap; }
  .pack-box { width:18px; height:18px; accent-color:var(--gold); cursor:pointer; }
  .pack-box:disabled { opacity:0.5; cursor:progress; }
  tr.packed td { opacity:0.5; }
  tr.packed td.pack { opacity:1; }
  /* Tracking / consignment number */
  td.track { white-space:nowrap; }
  .track-box { background:var(--panel); border:1px solid var(--line); color:var(--cream); font-family:var(--mono); font-size:11px; padding:6px 8px; width:130px; outline:none; }
  .track-box:focus { border-color:rgba(201,169,97,0.5); }
  .track-box:disabled { opacity:0.5; cursor:progress; }
  .track-link { display:inline-block; margin-left:6px; font-family:var(--mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="sub">Maison Obsidian · Admin</div>
    <h1 id="heading">Fragrance Requests</h1>
    <p style="margin:8px 0 0"><a href="staff.html" style="color:var(--gold);font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid rgba(201,169,97,.4);padding-bottom:2px">Open Staff Order Desk →</a></p>

    <div class="tabs">
      <button class="tab active" data-tab="requests">Requests</button>
      <button class="tab" data-tab="orders">Orders</button>
    </div>

    <div class="bar">
      <input type="password" id="token" placeholder="Admin token" autocomplete="current-password">
      <button class="go" id="load">View</button>
      <button class="ghost" id="refresh" hidden>Refresh</button>
      <button class="ghost" id="csv" hidden>Export CSV</button>
      <button class="ghost" id="packlist" hidden>Print Pack List</button>
      <button class="ghost" id="backfill" hidden>Sync from Stripe</button>
    </div>
    <p class="msg" id="msg"></p>
    <div class="count" id="count"></div>
    <div class="scroll"><table id="table" hidden>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>

<script src="data.js?v=20260802"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var tab = "requests";
  var rowsData = [];

  // Our fragrance name → the designer scent it's inspired by (from data.js).
  var INSP = {};
  (window.FRAGS || []).forEach(function(f){ if(f && f.name){ INSP[f.name.trim().toLowerCase()] = f.insp || ""; } });
  function inspOf(name){ return INSP[String(name==null?"":name).trim().toLowerCase()] || ""; }

  var VIEWS = {
    requests: {
      endpoint: "/api/requests", key: "requests", heading: "Fragrance Requests",
      csv: ["created_at","fragrance_name","brand","size","price","quantity","requester_name","email","note","status","product_id"],
      cols: ["When","Fragrance","Qty","Requester","Email","Note","Status"],
      row: function(r){
        return "<td class='muted'>"+esc(fmtDate(r.created_at))+"</td>"+
          "<td><div class='strong'>"+esc(r.fragrance_name)+"</div><div class='brand'>"+esc(r.brand||"")+(r.size?" · "+esc(r.size):"")+(r.price!=null?" · $"+esc(r.price):"")+"</div></td>"+
          "<td>"+esc(r.quantity)+"</td>"+
          "<td>"+esc(r.requester_name)+"</td>"+
          "<td><a href='mailto:"+esc(r.email)+"'>"+esc(r.email)+"</a></td>"+
          "<td class='muted'>"+esc(r.note||"")+"</td>"+
          "<td>"+esc(r.status||"")+"</td>";
      }
    },
    orders: {
      endpoint: "/api/orders", key: "orders", heading: "Paid Orders",
      csv: ["created_at","packed","tracking","amount_total","currency","items","name","email","mobile","delivery_method","delivery_notes","ship_address","ship_city","ship_region","ship_postcode","status","stripe_session_id","payment_intent_id"],
      cols: ["Packed","When","Items","Amount","Customer","Email","Shipping","Tracking","Status","Ref"],
      row: function(r){
        var amt = (typeof r.amount_total === "number") ? ("$"+(r.amount_total/100).toFixed(2)+" "+String(r.currency||"").toUpperCase()) : "";
        return "<td class='pack'><input type='checkbox' class='pack-box' data-id='"+esc(r.id||"")+"'"+(r.packed?" checked":"")+" title='Mark as packed'></td>"+
          "<td class='muted'>"+esc(fmtDate(r.created_at))+"</td>"+
          "<td>"+renderItems(r.items)+"</td>"+
          "<td class='amount'>"+amt+"</td>"+
          "<td>"+esc(r.name||"")+"</td>"+
          "<td><a href='mailto:"+esc(r.email||"")+"'>"+esc(r.email||"")+"</a></td>"+
          "<td>"+renderShipping(r)+"</td>"+
          "<td class='track'>"+renderTracking(r)+"</td>"+
          "<td>"+esc(r.status||"")+"</td>"+
          "<td class='ref'>"+esc(String(r.stripe_session_id||"").slice(-12))+"</td>";
      }
    }
  };

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function fmtDate(s){ if(!s) return ""; var d=new Date(s); return isNaN(d)?esc(s):d.toLocaleString(); }

  // "Our Name" plus the designer scent it's inspired by. One label = our name,
  // small gold line = inspiration.
  function scentLabel(name){
    name = String(name==null?"":name).trim();
    if(!name) return "";
    var ins = inspOf(name);
    return esc(name) + (ins ? " <span class='insp'>· inspired by "+esc(ins)+"</span>" : "");
  }

  // Turn the webhook's order summary text into an itemised list that shows both
  // our fragrance name and the scent it's inspired by. The summary is built in
  // api/checkout.js as "N× Name" lines and "Sample Box (A, B, C…)" joined by "; ".
  function renderItems(str){
    str = String(str==null?"":str).trim();
    if(!str) return "";
    var parts = str.split(";").map(function(s){ return s.trim(); }).filter(Boolean);
    return parts.map(function(p){
      var box = p.match(/^Sample Box\s*\((.+)\)\s*$/i);
      if(box){
        var inner = box[1].split(",").map(function(s){ return s.trim(); }).filter(Boolean)
          .map(function(n){ return "<div class='item-scent'>"+scentLabel(n)+"</div>"; }).join("");
        return "<div class='item-line'><span class='strong'>Sample Box · 5 × 10ml</span>"+inner+"</div>";
      }
      if(/^Sample Box$/i.test(p)){
        return "<div class='item-line'><span class='strong'>Sample Box · 5 × 10ml</span></div>";
      }
      var m = p.match(/^(\d+)\s*[×x]\s*(.+)$/);
      if(m){
        return "<div class='item-line'><span class='strong'>"+esc(m[1])+"× </span>"+scentLabel(m[2])+"</div>";
      }
      return "<div class='item-line'>"+scentLabel(p)+"</div>";
    }).join("");
  }

  // Full shipping / delivery details: recipient, address (with region), and
  // contact mobile — or the alternate-delivery instructions when chosen.
  function renderShipping(r){
    var isAlt = r.delivery_method === "alternate";
    var out = "<div class='brand'>"+(isAlt ? "Alternate delivery" : "Australia Post")+"</div>";
    if(r.name) out += "<div class='ship-name'>"+esc(r.name)+"</div>";
    if(isAlt){
      if(r.delivery_notes) out += "<div class='muted'>"+esc(r.delivery_notes)+"</div>";
    } else {
      if(r.ship_address) out += "<div class='muted'>"+esc(r.ship_address)+"</div>";
      var loc = [r.ship_city, r.ship_region, r.ship_postcode].filter(Boolean).map(esc).join(", ");
      if(loc) out += "<div class='muted'>"+loc+"</div>";
    }
    if(r.mobile) out += "<div class='muted'>☎ "+esc(r.mobile)+"</div>";
    return out;
  }

  // Editable tracking / consignment number, with an Australia Post track link
  // once a number is saved (posted orders only).
  function renderTracking(r){
    var t = r.tracking || "";
    var input = "<input type='text' class='track-box' data-id='"+esc(r.id||"")+"' value='"+esc(t)+"' placeholder='Add tracking…' autocomplete='off'>";
    var link = "";
    if(t && r.delivery_method !== "alternate"){
      link = "<a class='track-link' href='https://auspost.com.au/mypost/track/#/details/"+encodeURIComponent(t)+"' target='_blank' rel='noopener'>Track ↗</a>";
    }
    return input + link;
  }

  // Persist a PATCH to Supabase via /api/orders (admin-gated). `patch` is the
  // field(s) to change, e.g. { packed:true } or { tracking:"AA123" }.
  function saveOrder(id, patch, done){
    var token = $("token").value.trim();
    var payload = { id: id };
    for(var k in patch){ if(patch.hasOwnProperty(k)) payload[k] = patch[k]; }
    fetch("/api/orders", {
      method: "PATCH",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify(payload)
    })
      .then(function(r){ return r.json().then(function(d){ return { status:r.status, d:d }; }); })
      .then(function(res){ done(res.status===200 && res.d && res.d.ok, res.d && res.d.order); })
      .catch(function(){ done(false); });
  }
  function setPacked(id, checked, done){ saveOrder(id, { packed: checked }, done); }
  function msg(t, err){ var m=$("msg"); m.textContent=t; m.className = "msg" + (err?" err":""); }

  function render(list){
    var v = VIEWS[tab];
    rowsData = list;
    $("head").innerHTML = v.cols.map(function(c){ return "<th>"+c+"</th>"; }).join("");
    $("rows").innerHTML = list.map(function(r){
      var cls = (tab==="orders" && r.packed) ? " class='packed'" : "";
      return "<tr"+cls+">"+v.row(r)+"</tr>";
    }).join("");
    $("table").hidden = list.length === 0;
    $("count").textContent = list.length + " " + (list.length===1 ? v.key.replace(/s$/,"") : v.key);
    $("refresh").hidden = false;
    $("csv").hidden = list.length === 0;
    $("backfill").hidden = (tab !== "orders");
    $("packlist").hidden = (tab !== "orders" || list.length === 0);
  }

  function load(){
    var v = VIEWS[tab];
    var token = $("token").value.trim();
    if(!token){ msg("Enter the admin token.", true); return; }
    try { localStorage.setItem("mo_admin_token", token); } catch(e){}
    msg("Loading…", false);
    fetch(v.endpoint, { headers: { Authorization: "Bearer " + token, Accept: "application/json" } })
      .then(function(r){ return r.json().then(function(d){ return {status:r.status, d:d}; }); })
      .then(function(res){
        if(res.status===200 && res.d && res.d.ok){ msg("", false); render(res.d[v.key]||[]); }
        else if(res.status===401){ msg("Unauthorized — check the token.", true); }
        else { msg((res.d && res.d.error) || "Could not load.", true); }
      })
      .catch(function(){ msg("Network error.", true); });
  }

  function toCSV(){
    var cols = VIEWS[tab].csv;
    var esc2 = function(val){ val=String(val==null?"":val); return /[",\n]/.test(val) ? '"'+val.replace(/"/g,'""')+'"' : val; };
    var lines = [cols.join(",")].concat(rowsData.map(function(r){ return cols.map(function(c){ return esc2(r[c]); }).join(","); }));
    var blob = new Blob([lines.join("\n")], { type:"text/csv" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "maison-obsidian-"+tab+".csv"; a.click();
    URL.revokeObjectURL(a.href);
  }

  /* ---------- Pack list (printable / Save as PDF) ---------- */

  function amountText(r){
    return (typeof r.amount_total === "number") ? ("$"+(r.amount_total/100).toFixed(2)+" "+String(r.currency||"").toUpperCase()) : "";
  }

  // Small "· inspired by <designer scent>" tag for a fragrance, for the print
  // sheet. Helps staff confirm the right bottle off the shelf.
  function packInsp(name){
    var ins = inspOf(name);
    return ins ? " <span class='insp'>· inspired by "+esc(ins)+"</span>" : "";
  }

  // Items rendered as a tick-box picking checklist: our product name (+ the
  // scent it's inspired by) and quantities; sample boxes expand to their 5
  // scents.
  function packItemsList(str){
    str = String(str==null?"":str).trim();
    if(!str) return "<ul class='items'><li><span class='cb'></span>(no item detail)</li></ul>";
    var parts = str.split(";").map(function(s){ return s.trim(); }).filter(Boolean);
    return "<ul class='items'>"+parts.map(function(p){
      var box = p.match(/^Sample Box\s*\((.+)\)\s*$/i);
      if(box){
        var scents = box[1].split(",").map(function(s){ return s.trim(); }).filter(Boolean)
          .map(function(n){ return "<li><span class='cb'></span>"+esc(n)+packInsp(n)+"</li>"; }).join("");
        return "<li><span class='cb'></span><strong>Sample Box · 5 × 10ml</strong><ul class='sub'>"+scents+"</ul></li>";
      }
      if(/^Sample Box$/i.test(p)) return "<li><span class='cb'></span><strong>Sample Box · 5 × 10ml</strong></li>";
      var m = p.match(/^(\d+)\s*[×x]\s*(.+)$/);
      if(m) return "<li><span class='cb'></span><strong>"+esc(m[1])+" ×</strong> "+esc(m[2])+packInsp(m[2])+"</li>";
      return "<li><span class='cb'></span>"+esc(p)+packInsp(p)+"</li>";
    }).join("")+"</ul>";
  }

  function packShipping(r){
    var isAlt = r.delivery_method === "alternate";
    var lines = ["<strong>"+(isAlt ? "Alternate delivery" : "Australia Post")+"</strong>"];
    if(r.name) lines.push(esc(r.name));
    if(isAlt){ if(r.delivery_notes) lines.push(esc(r.delivery_notes)); }
    else {
      if(r.ship_address) lines.push(esc(r.ship_address));
      var loc = [r.ship_city, r.ship_region, r.ship_postcode].filter(Boolean).map(esc).join(", ");
      if(loc) lines.push(loc);
    }
    if(r.mobile) lines.push("Ph: "+esc(r.mobile));
    if(r.email) lines.push(esc(r.email));
    return lines.join("<br>");
  }

  function packListCSS(){
    return "body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#111;margin:24px;}"+
      ".ph{border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:18px;}"+
      ".ph h1{margin:0;font-size:22px;font-weight:700;}"+
      ".pmeta{font-size:12px;color:#555;margin-top:4px;}"+
      ".order{border:1px solid #bbb;border-radius:6px;padding:14px 16px;margin-bottom:14px;page-break-inside:avoid;}"+
      ".ohead{display:flex;justify-content:space-between;font-size:12px;color:#555;margin-bottom:2px;}"+
      ".onum{font-weight:700;color:#111;}.oref{font-family:monospace;}"+
      ".ometa{font-size:12px;color:#555;margin-bottom:10px;}"+
      ".cols{display:flex;gap:24px;}.citems{flex:1;}.cship{width:36%;font-size:13px;line-height:1.55;}"+
      ".label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#777;margin-bottom:6px;}"+
      "ul.items{list-style:none;margin:0;padding:0;}ul.items li{font-size:14px;margin:6px 0;}"+
      "ul.sub{list-style:none;margin:5px 0 6px 34px;padding:0;}ul.sub li{font-size:13px;color:#333;margin:3px 0;}"+
      ".insp{color:#666;font-style:italic;font-size:12px;}"+
      ".cb{width:13px;height:13px;border:1.5px solid #111;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:9px;}"+
      "@media print{body{margin:0;}.order{border-color:#999;}}";
  }

  function packListHTML(orders, when){
    var cards = orders.map(function(r, idx){
      return "<section class='order'>"+
        "<div class='ohead'><span class='onum'>#"+(idx+1)+" / "+orders.length+"</span>"+
          "<span class='oref'>"+esc(String(r.stripe_session_id||"").slice(-12))+"</span></div>"+
        "<div class='ometa'>"+esc(fmtDate(r.created_at))+(amountText(r)?" · "+esc(amountText(r)):"")+"</div>"+
        "<div class='cols'>"+
          "<div class='citems'><div class='label'>Items to pack</div>"+packItemsList(r.items)+"</div>"+
          "<div class='cship'><div class='label'>Ship to</div>"+packShipping(r)+"</div>"+
        "</div></section>";
    }).join("");
    return "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Pack List — Maison Obsidian</title>"+
      "<style>"+packListCSS()+"</style></head><body>"+
      "<header class='ph'><h1>Pack List</h1><div class='pmeta'>Maison Obsidian · "+esc(when)+" · "+
        orders.length+" order"+(orders.length===1?"":"s")+" to pack</div></header>"+
      cards+"</body></html>";
  }

  // Open a printable pack list of orders still needing packing (not yet packed).
  // A new window lets the browser Print or Save as PDF.
  function packList(){
    var pending = rowsData.filter(function(r){ return !r.packed; });
    if(!pending.length){ msg("Nothing to pack — every order is marked packed.", false); return; }
    var when = new Date().toLocaleString();
    var win = window.open("", "_blank");
    if(!win){ msg("Pop-up blocked — allow pop-ups for this site to print the pack list.", true); return; }
    win.document.write(packListHTML(pending, when));
    win.document.close();
    win.focus();
    setTimeout(function(){ try { win.print(); } catch(e){} }, 350);
    msg(pending.length+" order"+(pending.length===1?"":"s")+" sent to the pack list.", false);
  }

  function switchTab(next){
    if(next === tab) return;
    tab = next;
    Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){ b.classList.toggle("active", b.getAttribute("data-tab")===tab); });
    $("heading").textContent = VIEWS[tab].heading;
    $("table").hidden = true; $("rows").innerHTML=""; $("count").textContent=""; $("csv").hidden=true; $("refresh").hidden=true; $("backfill").hidden=true; $("packlist").hidden=true;
    if($("token").value.trim()) load(); // auto-load the other tab if already authed
  }

  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
    b.addEventListener("click", function(){ switchTab(b.getAttribute("data-tab")); });
  });
  // Save an edited tracking number (fires on blur / Enter — delegated).
  $("rows").addEventListener("change", function(e){
    var input = e.target;
    if(!input || !input.classList || !input.classList.contains("track-box")) return;
    var id = input.getAttribute("data-id");
    if(!id){ msg("This order has no id to update.", true); return; }
    var val = input.value.trim();
    var rec = null;
    for(var i=0;i<rowsData.length;i++){ if(String(rowsData[i].id)===String(id)){ rec = rowsData[i]; break; } }
    input.disabled = true;
    saveOrder(id, { tracking: val }, function(ok, order){
      input.disabled = false;
      if(ok){
        var saved = (order && typeof order.tracking !== "undefined") ? (order.tracking || "") : val;
        if(rec) rec.tracking = saved;
        var td = input.parentNode;
        if(td){ td.innerHTML = renderTracking({ id:id, tracking:saved, delivery_method:(rec && rec.delivery_method) }); }
        msg("", false);
      } else {
        msg("Could not save the tracking number — check your token and try again.", true);
      }
    });
  });

  // Toggle "packed" straight from the table (delegated — rows are re-rendered).
  $("rows").addEventListener("change", function(e){
    var box = e.target;
    if(!box || !box.classList || !box.classList.contains("pack-box")) return;
    var id = box.getAttribute("data-id");
    var want = box.checked;
    if(!id){ box.checked = !want; msg("This order has no id to update.", true); return; }
    box.disabled = true;
    setPacked(id, want, function(ok){
      box.disabled = false;
      if(ok){
        var tr = box.parentNode && box.parentNode.parentNode;
        if(tr && tr.classList) tr.classList.toggle("packed", want);
        for(var i=0;i<rowsData.length;i++){ if(String(rowsData[i].id)===String(id)){ rowsData[i].packed = want; break; } }
        msg("", false);
      } else {
        box.checked = !want; // revert on failure
        msg("Could not save the packed state — check your token and try again.", true);
      }
    });
  });

  // Pull paid Checkout Sessions straight from Stripe into Supabase — repairs
  // orders that never reached the webhook. Idempotent, so safe to re-run.
  function backfill(){
    var token = $("token").value.trim();
    if(!token){ msg("Enter the admin token.", true); return; }
    if(!window.confirm("Sync paid orders from Stripe into the admin? This is safe to run repeatedly.")) return;
    $("backfill").disabled = true;
    msg("Syncing from Stripe…", false);
    fetch("/api/backfill", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ limit: 300 })
    })
      .then(function(r){ return r.json().then(function(d){ return { status:r.status, d:d }; }); })
      .then(function(res){
        $("backfill").disabled = false;
        if(res.status===200 && res.d && res.d.ok){
          msg("Synced — "+res.d.saved+" paid order"+(res.d.saved===1?"":"s")+" written (scanned "+res.d.scanned+").", false);
          load();
        } else {
          msg((res.d && res.d.error) || "Sync failed.", true);
        }
      })
      .catch(function(){ $("backfill").disabled = false; msg("Network error during sync.", true); });
  }

  $("load").addEventListener("click", load);
  $("refresh").addEventListener("click", load);
  $("csv").addEventListener("click", toCSV);
  $("packlist").addEventListener("click", packList);
  $("backfill").addEventListener("click", backfill);
  $("token").addEventListener("keydown", function(e){ if(e.key==="Enter") load(); });
  try { var saved = localStorage.getItem("mo_admin_token"); if(saved){ $("token").value = saved; } } catch(e){}
})();
</script>
</body>
</html>
